        <li><b data-en="Crew" data-tr="Ekip"></b><span data-en="Parallel agents: a fast model reads and searches, a mid model builds, the strongest one designs." data-tr="Paralel ajanlar: hızlı model okur ve arar, orta model üretir, en güçlüsü tasarlar."></span></li>
        <li><b data-en="Checklist" data-tr="Kontrol listesi"></b><span data-en="Proof before done: tests, type checks, audio loudness, screenshots." data-tr="Bitti demeden kanıt: test, tip kontrolü, ses seviyesi, ekran görüntüsü."></span></li>
        <li><b data-en="Second pilot" data-tr="İkinci pilot"></b><span data-en="A fresh agent with no history critiques the result." data-tr="Geçmişi bilmeyen yeni bir ajan sonucu eleştirir."></span></li>
        <li><b data-en="Ground control" data-tr="Yer kontrol"></b><span data-en="No reply, post, payment or launch goes out without our yes." data-tr="Onayımız olmadan hiçbir cevap, paylaşım, ödeme ya da yayın çıkmaz."></span></li>

        <li data-en="<b>A second brain</b> in plain Markdown and git that Claude, Codex, Gemini and Cursor all read, with a shield that blocks any commit containing a token or bank number." data-tr="<b>İkinci beyin:</b> Claude, Codex, Gemini ve Cursor'ın okuduğu düz Markdown ve git; token ya da banka numarası içeren commit'i durduran bir kalkanla."></li>
        <li data-en="<b>Watchdogs:</b> a scheduled task keeps 7 workers alive day and night and emails us when one stops." data-tr="<b>Bekçiler:</b> zamanlanmış bir görev 7 işçiyi gece gündüz ayakta tutar, biri durursa bize mail atar."></li>
        <li data-en="<b>This page:</b> five agents searched our computer for projects, then three judge agents and Gemini reviewed the plan." data-tr="<b>Bu sayfa:</b> beş ajan bilgisayarımızda projeleri aradı, sonra üç hakem ajan ve Gemini planı değerlendirdi."></li>
